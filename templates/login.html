{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - EL FUERTE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            background-color: #f0f2f5;
        }

        .split-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            background: white;
            box-shadow: 20px 0 40px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .right-panel {
            flex: 1.2;
            background: linear-gradient(135deg, #ff6a00 0%, #ee0979 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }

        .right-panel::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 10%, transparent 10%), radial-gradient(circle, rgba(255,255,255,0.1) 10%, transparent 10%);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            opacity: 0.5;
            animation: moveBg 20s linear infinite;
        }

        @keyframes moveBg {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50px); }
        }

        .login-form-wrapper {
            width: 100%;
            max-width: 400px;
        }

        .brand-title {
            font-weight: 800;
            font-size: 2.5rem;
            color: #111;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .input-floating {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-floating input {
            width: 100%;
            padding: 1.2rem;
            border: 2px solid #e1e5eb;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: 'Outfit', sans-serif;
            background: #f8fafc;
        }

        .input-floating input:focus {
            outline: none;
            border-color: #ff6a00;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 106, 0, 0.1);
        }

        .input-floating label {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            transition: all 0.3s;
            pointer-events: none;
            background: transparent;
            padding: 0 0.5rem;
        }

        .input-floating input:focus ~ label,
        .input-floating input:not(:placeholder-shown) ~ label {
            top: 0;
            font-size: 0.8rem;
            color: #ff6a00;
            font-weight: 600;
            background: white;
        }

        .btn-brand {
            background: linear-gradient(to right, #ff6a00, #ff8c00);
            color: white;
            border: none;
            padding: 1.2rem;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
        }

        .btn-brand:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 106, 0, 0.3);
            color: white;
        }

        .huge-logo {
            width: 250px;
            height: 250px;
            object-fit: contain;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.3));
            margin-bottom: 2rem;
            z-index: 2;
        }

        .slogan {
            font-size: 1.8rem;
            font-weight: 300;
            text-align: center;
            z-index: 2;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .password-eye {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #a0aec0;
            z-index: 5;
        }

        @media (max-width: 992px) {
            .split-container {
                flex-direction: column;
            }
            .right-panel {
                flex: none;
                padding: 4rem 2rem;
            }
            .left-panel {
                padding: 3rem 1.5rem;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="split-container">
        <div class="right-panel">
            <img src="{% static 'img/logo.png' %}" alt="EL FUERTE Logo" class="huge-logo">
            <h1 class="slogan">La fuerza que construye<br>tus mejores proyectos.</h1>
        </div>
        
        <div class="left-panel">
            <div class="login-form-wrapper">
                <h1 class="brand-title">Bienvenido.</h1>
                <p class="text-muted mb-5">Ingresa tus credenciales para administrar la ferretería.</p>

                {% if messages %}
                    <div class="mb-4">
                        {% for message in messages %}
                            <div class="alert alert-danger" style="border-radius: 12px; border: none; background: #fff5f5; color: #c53030;" role="alert">
                                <i class="fa-solid fa-shield-xmark me-2"></i> {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="input-floating">
                        <input type="text" id="usuario" name="usuario" placeholder=" " required autocomplete="off">
                        <label for="usuario">Nombre de Usuario</label>
                    </div>

                    <div class="input-floating">
                        <input type="password" id="password" name="password" placeholder=" " required autocomplete="off">
                        <label for="password">Contraseña</label>
                        <i class="fa-solid fa-eye password-eye" id="togglePassword"></i>
                    </div>

                    <button type="submit" class="btn-brand">
                        Entrar al Sistema <i class="fa-solid fa-arrow-right fs-5 align-middle"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('togglePassword').addEventListener('click', function (e) {
            const password = document.getElementById('password');
            if (password.type === 'password') {
                password.type = 'text';
                this.classList.remove('bi-eye');
                this.classList.add('bi-eye-slash');
            } else {
                password.type = 'password';
                this.classList.remove('bi-eye-slash');
                this.classList.add('bi-eye');
            }
        });
    </script>
</body>
</html>
